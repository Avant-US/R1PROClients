session_name: hdas
start_directory: ${START_DIR}/modules/hdas
windows:
- window_name: HDAS|zed|signal_camera|realsense
  layout: even-horizontal
  panes:
  - shell_command:
      - sleep 1
      - ./start_hdas_r1pro.sh
  - shell_command:
      - sleep 1
      - ./start_zed_camera.sh
  - shell_command:
      - sleep 1
      - ./start_signal_camera_head.sh
  - shell_command:
      - sleep 1
      - ./start_realsense_camera_r1pro_shijia.sh
